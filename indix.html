<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />


</head>

<body>

    <div class="h-screen bg-gradient-to-br
     from-blue-700 via-blue-500 to-blue-300
      flex flex-col justify-center items-center
      p-8 min-[425px]:px-16 min-[425px]:py-4
     ">

        <div class="search border h-10 flex
         items-center px-2 rounded-2xl
          bg-gradient-to-r from-blue-400 via-blue-500
             to-blue-600 mb-3 w-full sm:h-10 sm:w-1/2 shadow-xl ">

            <i class="fa-solid fa-magnifying-glass text-white"></i>
            <input class="bg-transparent placeholder:text-white ml-2 flex-1 outline-none text-white"
             type="text" placeholder="Search city...">
        </div>

        <div class="info w-full h-auto p-2 rounded-2xl text-center
         border bg-[url('/images/info-img.jpg')] bg-center bg-cover bg-no-repeat
         mb-3 sm:w-1/2 shadow-xl
         ">
            <div class="city-name">
                <h2 class="city-n text-xl text-white font-medium ">Mingora</h2>
            </div>
            <div class="weather-icon flex justify-center">
                <img src="./weather-icon/1.webp" alt="weather-icon" class="w-[40%]">
            </div>

            <div class="centigrade">
                <h2 class="text-6xl text-white font-medium">25 <span class="text-lg py-1 absolute ">°C</span></h2>
                <p class="text-white text-xs opacity-95">partly cloudy</p>
            </div>

        </div>

        <div class="x-info w-full grid grid-cols-2 place-content-between gap-2 sm:w-1/2 ">
            <div class="humidity rounded-xl border h-16 p-2 flex items-center shadow-xl">
                <div class="drop-icon w-8 bg-gradient-to-br from-blue-700 to-blue-400
                 border rounded-[50%]">
                    <img src="./images/drop-icons.png" alt="">
                </div>
                <div class="text-white ml-2">
                    <h3 class="font-bold">60%</h3>
                    <p class="text-xs">Humidity</p>
                </div>
            </div>
            <div class="wind border rounded-xl h-16 p-2 flex items-center shadow-xl">
                <div class="drop-icon w-8 bg-gradient-to-br from-blue-700 to-blue-400
                 border rounded-[50%]">
                    <img src="./images/wind-icons.png" alt="">
                </div>
                <div class="text-white ml-2">
                    <h3 class="font-bold">15 <span class="text-xs font-medium">km/h</span></h3>
                    <p class="text-xs">Wind Speed</p>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
