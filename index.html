<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />


</head>

<body>

    <div class="h-screen bg-gradient-to-br
     from-blue-700 via-blue-500 to-blue-300
      flex flex-col justify-center items-center
      p-8 min-[425px]:px-16 min-[425px]:py-4
     ">

        <div class="flex items-center w-full h-10 px-2 mb-3 border shadow-xl search rounded-2xl bg-gradient-to-r from-blue-400 via-blue-500 to-blue-600 sm:h-10 sm:w-1/2 ">

            <i class="text-white fa-solid fa-magnifying-glass"></i>
            <input id="input" class="flex-1 ml-2 text-white bg-transparent border-none outline-none placeholder:text-white"
             type="text" placeholder="Search city..." spellcheck="false">
        </div>

        <div class="info w-full h-auto p-2 rounded-2xl text-center
         border bg-[url('/images/info-img.jpg')] bg-center bg-cover bg-no-repeat
         mb-3 sm:w-1/2 shadow-xl
         ">
            <div class="city-name">
                <h2 id="city-name" class="text-xl font-medium text-white city-n ">City Name</h2>
            </div>
            <div class="flex justify-center weather-icon">
                <img src="./weather-icon/1.webp" alt="weather-icon" id="w-icon" class="w-[40%]">
            </div>

            <div class="temperature">
                <div class="temp-ctr">
                    <h2 id="temp" class="text-6xl font-medium text-white">0</h2>
                    <span class="relative text-xl font-bold text-white -right-11 -top-12 temp-icon ">°C</span>
                </div>
                <p id="Condition" class="text-sm text-white opacity-100">Weather</p>
            </div>

        </div>

        <div class="grid w-full grid-cols-2 gap-2 x-info place-content-between sm:w-1/2 ">
            <div class="flex items-center h-16 p-2 border shadow-xl humidity rounded-xl">
                <div class="drop-icon w-8 bg-gradient-to-br from-blue-700 to-blue-400
                 border rounded-[50%]">
                    <img src="./images/drop-icons.png" alt="">
                </div>
                <div class="ml-2 text-white">
                    <h3 id="humid" class="font-bold">0%</h3>
                    <p class="text-xs">Humidity</p>
                </div>
            </div>
            <div class="flex items-center h-16 p-2 border shadow-xl wind rounded-xl">
                <div class="drop-icon w-8 bg-gradient-to-br from-blue-700 to-blue-400
                 border rounded-[50%]">
                    <img src="./images/wind-icons.png" alt="">
                </div>
                <div class="ml-2 text-white">
                    <div class="flex humidity-ctr">
                        <h3 id="wind" class="font-bold">0</h3>
                        <span class="mt-1.5 ml-0.5 text-xs font-medium">km/h</span>
                    </div>
                    <p class="text-xs">Wind Speed</p>
                </div>
            </div>
        </div>

    </div>

    <script src="./script.js"></script>
</body>

</html>
